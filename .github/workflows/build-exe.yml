name: Build exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 默认最小权限；只有 publish 任务才临时提权
permissions:
  contents: read

# 同一版本不并发发布
concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 Windows EXE
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 静态自检（语法 / DOM id / CSS 变量 / CSP）
        run: npm run check

      - name: 打包 portable exe
        run: npm run app:pack

      - name: 打成英文名 zip（内部保留中文 exe）
        run: npm run app:zip

      - name: 校验产物并生成 SHA256
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"

          # 打 tag 发布时，tag 必须与 package.json 版本一致，避免误覆盖旧版本
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag ($env:GITHUB_REF_NAME) 与 package.json 版本 (v$version) 不一致"
          }

          $zip = "dist/bili-extractor-$version-win-x64.zip"
          if (!(Test-Path -LiteralPath $zip)) {
            throw "ZIP 文件不存在: $zip"
          }

          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Write-Host "ZIP: $zip"
          Write-Host "SHA256: $hash"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bili-extractor-${{ github.ref_name }}-win-x64
          path: |
            dist/bili-extractor-*-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 发布 GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: bili-extractor-${{ github.ref_name }}-win-x64
          path: dist

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          ZIP="dist/bili-extractor-${VERSION}-win-x64.zip"

          # 先确认产物齐全，再动 Release —— 顺序反了会出现「附件删了但新包没传上」
          test -s "$ZIP"
          test -s "dist/SHA256SUMS.txt"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # 只替换同名附件，保留 Release 的其他资源与说明
            gh release upload "$TAG" "$ZIP" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$ZIP" dist/SHA256SUMS.txt \
              --title "哔哩提取器 $TAG" \
              --generate-notes \
              --verify-tag
          fi
